name: Screen bounded descriptor matching
on:
  create:
  push:
    branches:
      - validation-matcher-streaming-20261119
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-matcher-streaming-20261119
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'Afloat16/kornia' && github.ref == 'refs/heads/validation-matcher-streaming-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_NO_SYNC: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Afloat16/kornia
          ref: 7ecfbb392285e03f73b4dd4cce62fc3fb8349c33
          fetch-depth: 1
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.40.0
          cache: false
      - name: Install CPU-only environment
        shell: bash
        run: |
          pixi run uv venv .venv
          pixi run uv pip install --python .venv/bin/python --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pixi run uv pip install --python .venv/bin/python -e ".[dev]" opencv-python-headless==4.12.0.88
          mkdir -p validation-results
          .venv/bin/python -c 'import sys,torch,kornia,cv2; print(sys.executable); print(kornia.__file__); print(torch.__version__,cv2.__version__); assert torch.version.cuda is None' | tee validation-results/environment.log
      - name: Screen exact matching outputs and allocation with image descriptors
        shell: bash
        run: |
          cat > validation-results/probe.py <<'PYCODE'
          import gc
          import hashlib
          import json
          import os
          import tempfile
          import urllib.request
          from pathlib import Path
          
          import cv2
          import numpy as np
          import torch
          
          import kornia
          from benchmarks.common import run_metadata, time_us, warm_up_cpu
          from kornia.feature import matching
          
          
          def streaming_match(desc1, desc2, mode, threshold=0.8, block=512):
              ratio = mode in ("snn", "smnn")
              mutual = mode in ("mnn", "smnn")
              norms1 = desc1.pow(2).sum(-1, keepdim=True)
              norms2 = desc2.pow(2).sum(-1, keepdim=True)
              padded1 = torch.cat([desc1.mul(-2), norms1, torch.ones_like(norms1)], -1)
              padded2 = torch.cat([desc2, torch.ones_like(norms2), norms2], -1).mT
              forward_values, forward_indices, reverse_values, reverse_indices = [], [], [], []
              for begin in range(0, len(desc1), block):
                  squared = padded1[begin : begin + block].matmul(padded2)
                  if ratio:
                      vals, idxs = squared.topk(2, dim=1, largest=False)
                  else:
                      vals, idxs = squared.min(dim=1)
                  forward_values.append(vals)
                  forward_indices.append(idxs)
                  if mutual:
                      if ratio:
                          vals, idxs = squared.topk(min(2, squared.size(0)), dim=0, largest=False)
                      else:
                          vals, idxs = squared.min(dim=0, keepdim=True)
                      reverse_values.append(vals)
                      reverse_indices.append(idxs + begin)
                  del squared
              vals = torch.cat(forward_values)
              idxs = torch.cat(forward_indices)
              if ratio:
                  distances = matching._distance_from_squared(vals)
                  first_values, first_indices = distances[:, 0] / distances[:, 1], idxs[:, 0]
              else:
                  first_values, first_indices = matching._distance_from_squared(vals), idxs
              if mutual:
                  vals, idxs = torch.cat(reverse_values), torch.cat(reverse_indices)
                  if ratio:
                      best, picked = vals.topk(2, dim=0, largest=False)
                      distances = matching._distance_from_squared(best)
                      second_values = distances[0] / distances[1]
                      second_indices = idxs.gather(0, picked[:1])[0]
                  else:
                      best, picked = vals.min(dim=0)
                      second_values = matching._distance_from_squared(best)
                      second_indices = idxs.gather(0, picked[None])[0]
              if mode == "nn":
                  indices = torch.stack([torch.arange(len(desc1)), first_indices], 1)
                  return first_values[:, None], indices
              if mode == "mnn":
                  short = torch.arange(min(len(desc1), len(desc2)))
                  if len(desc1) <= len(desc2):
                      chosen = torch.nonzero(short == second_indices[first_indices][: len(short)])[:, 0]
                      indices = torch.stack([chosen, first_indices[chosen]], 1)
                      distances = first_values[chosen]
                  else:
                      chosen = torch.nonzero(short == first_indices[second_indices][: len(short)])[:, 0]
                      indices = torch.stack([second_indices[chosen], chosen], 1)
                      distances = second_values[chosen]
                  return distances[:, None], indices
              keep = first_values <= threshold
              if mutual:
                  backwards = second_values[first_indices]
                  keep &= (backwards <= threshold) & (second_indices[first_indices] == torch.arange(len(desc1)))
              chosen = torch.nonzero(keep)[:, 0]
              distances = torch.maximum(first_values[chosen], backwards[chosen]) if mutual else first_values[chosen]
              return distances[:, None], torch.stack([chosen, first_indices[chosen]], 1)
          
          
          def peak_bytes(fn):
              gc.collect()
              with torch.profiler.profile(activities=[torch.profiler.ProfilerActivity.CPU], profile_memory=True) as profiler:
                  result = fn()
              with tempfile.NamedTemporaryFile(suffix=".json", delete=False) as trace:
                  path = Path(trace.name)
              profiler.export_chrome_trace(str(path))
              data = json.loads(path.read_text())
              path.unlink()
              events = [e["args"] for e in data["traceEvents"] if e.get("name") == "[memory]"]
              events = [e for e in events if "Total Allocated" in e and "Bytes" in e]
              before = events[0]["Total Allocated"] - events[0]["Bytes"]
              peak = max(e["Total Allocated"] for e in events) - before
              del result, profiler
              return peak
          
          
          assert Path(kornia.__file__).resolve().is_relative_to(Path.cwd().resolve())
          torch.set_num_threads(1)
          cv2.setNumThreads(1)
          cv2.setRNGSeed(41)
          cpu = min(os.sched_getaffinity(0))
          os.sched_setaffinity(0, {cpu})
          warm_up_cpu()
          root = Path("validation-results")
          images = []
          descriptors = []
          for filename in ("graf1.png", "graf3.png"):
              url = "https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/" + filename
              payload = urllib.request.urlopen(url, timeout=60).read()
              image = cv2.imdecode(np.frombuffer(payload, dtype=np.uint8), cv2.IMREAD_GRAYSCALE)
              assert image is not None
              image = cv2.resize(image, None, fx=2, fy=2, interpolation=cv2.INTER_CUBIC)
              keypoints, desc = cv2.SIFT_create(nfeatures=8192, contrastThreshold=0.01).detectAndCompute(image, None)
              order = np.argsort(-np.asarray([keypoint.response for keypoint in keypoints]), kind="stable")
              desc = desc[order]
              desc = np.sqrt(desc / desc.sum(1, keepdims=True))
              descriptors.append(torch.from_numpy(desc))
              images.append({"url": url, "sha256": hashlib.sha256(payload).hexdigest(), "image_shape": list(image.shape), "rows": len(desc)})
          np.savez_compressed(root / "descriptors.npz", desc1=descriptors[0].numpy(), desc2=descriptors[1].numpy())
          records = []
          for requested1, requested2, dtype in [(256, 256, torch.float32), (1024, 1024, torch.float32), (2048, 2048, torch.float32), (4096, 4096, torch.float32), (8192, 8192, torch.float32), (4099, 2049, torch.float64)]:
              desc1, desc2 = descriptors[0][:requested1].to(dtype), descriptors[1][:requested2].to(dtype)
              for mode in ("nn", "mnn", "snn", "smnn"):
                  api = getattr(matching, "match_" + mode)
                  kwargs = {"th": 0.8} if mode in ("snn", "smnn") else {}
                  base = lambda: api(desc1, desc2, **kwargs)
                  changed = lambda: streaming_match(desc1, desc2, mode)
                  expected, actual = base(), changed()
                  torch.testing.assert_close(actual[1], expected[1], rtol=0, atol=0)
                  torch.testing.assert_close(actual[0], expected[0], rtol=2e-5, atol=2e-7)
                  row = {"mode": mode, "rows": [len(desc1), len(desc2)], "dimension": desc1.size(1), "dtype": str(dtype),
                         "matches": len(actual[0]), "score_max_error": (actual[0] - expected[0]).abs().max().item() if actual[0].numel() else 0,
                         "base_output_sha256": hashlib.sha256(expected[0].numpy().tobytes() + expected[1].numpy().tobytes()).hexdigest(),
                         "fixed_output_sha256": hashlib.sha256(actual[0].numpy().tobytes() + actual[1].numpy().tobytes()).hexdigest()}
                  del expected, actual
                  row["base"], row["fixed"] = [], []
                  for repeat in range(3):
                      pairs = [("base", base), ("fixed", changed)] if repeat % 2 == 0 else [("fixed", changed), ("base", base)]
                      for label, fn in pairs:
                          median, iqr = time_us(fn, min_run_time=0.25)
                          row[label].append({"median_us": median, "iqr_us": iqr})
                  row["peak_base_bytes"], row["peak_fixed_bytes"] = peak_bytes(base), peak_bytes(changed)
                  records.append(row)
                  (root / "screen.json").write_text(json.dumps({"metadata": run_metadata(torch.device("cpu")), "cpu": cpu,
                                                                 "images": images, "results": records}, indent=2) + "\n")
                  print(mode, row["rows"], dtype, row["matches"], row["score_max_error"], flush=True)
          PYCODE
          .venv/bin/python - < validation-results/probe.py | tee validation-results/probe.log
      - name: Upload screening evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matcher-streaming-screen
          path: validation-results/
          if-no-files-found: warn
          retention-days: 14

