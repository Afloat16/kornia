name: Resolve masked MI timing variance

on:
  create:
  push:
    branches:
      - validation-mi-mask-alignment-20261119
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-mi-mask-alignment-20261119
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'Afloat16/kornia' && github.ref == 'refs/heads/validation-mi-mask-alignment-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_NO_SYNC: "1"
      KORNIA_TEST_DEVICE: cpu
      KORNIA_TEST_RUNSLOW: "false"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      ONEDNN_MAX_CPU_ISA: AVX512_CORE_BF16
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Afloat16/kornia
          ref: a9808abb8b5c0bd785bb866e7ecb71e0cca6a329
          fetch-depth: 2
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.40.0
          cache: false
      - name: Install CPU-only test environment
        shell: bash
        run: |
          pixi run uv venv .venv
          pixi run uv pip install --python .venv/bin/python --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pixi run uv pip install --python .venv/bin/python -e ".[dev]"
          mkdir -p validation-results
          .venv/bin/python -c 'import sys,torch,kornia; print(sys.executable); print(kornia.__file__); print(torch.__version__); assert torch.version.cuda is None' | tee validation-results/environment.log
          .venv/bin/python .github/scripts/check_torch_env.py --channel pinned --expected 2.15.0
      - name: Run long-lived paired checkout benchmarks
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/kornia-mi-base" 9a311912c0579ed010face500a26dca5360453b0
          cat > validation-results/paired-child.py <<'PYCODE'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path
          
          import torch
          
          import kornia
          from benchmarks.common import run_metadata, time_us, warm_up_cpu
          from kornia.losses.mutual_information import MILossFromRef2D, mutual_information_loss_2d
          
          assert Path(kornia.__file__).resolve().is_relative_to(Path.cwd().resolve())
          torch.set_num_threads(1)
          cpu = min(os.sched_getaffinity(0))
          os.sched_setaffinity(0, {cpu})
          warm_up_cpu()
          source = Path(kornia.losses.mutual_information.__file__)
          print(json.dumps({"ready": True, "metadata": run_metadata(torch.device("cpu")),
                            "kornia_module": str(Path(kornia.__file__).resolve()),
                            "source_sha256": hashlib.sha256(source.read_bytes()).hexdigest(),
                            "python": sys.executable, "cpu": cpu}), flush=True)
          
          for line in sys.stdin:
              case = json.loads(line)
              batch, size, kind = case["batch"], case["size"], case["mask"]
              generator = torch.Generator().manual_seed(42)
              reference = torch.rand(batch, size, size, generator=generator)
              image = (0.7 * reference + 0.3 * torch.rand(batch, size, size, generator=generator)).requires_grad_()
              input_mask = target_mask = None
              if kind != "none":
                  input_mask = torch.zeros(size, size, dtype=torch.bool)
                  target_mask = torch.zeros_like(input_mask)
                  if kind == "full":
                      input_mask[:] = target_mask[:] = True
                  elif kind == "overlap":
                      input_mask[:, : 3 * size // 4] = True
                      target_mask[: 3 * size // 4, :] = True
                  else:
                      input_mask[size // 4 : size // 2, size // 4 : size // 2] = True
                      target_mask[3 * size // 8 : 5 * size // 8, size // 4 : size // 2] = True
              module = MILossFromRef2D(reference, target_mask, num_bins=32)
          
              def from_reference():
                  return module(image, input_mask)
          
              def forward_backward():
                  image.grad = None
                  loss = mutual_information_loss_2d(image, reference, input_mask, target_mask, num_bins=32)
                  loss.sum().backward()
                  return loss.detach()
          
              output = forward_backward()
              row = dict(case)
              row["loss_sha256"] = hashlib.sha256(output.numpy().tobytes()).hexdigest()
              row["gradient_sha256"] = hashlib.sha256(image.grad.numpy().tobytes()).hexdigest()
              for name, operation in (("from_ref_forward", from_reference), ("functional_forward_backward", forward_backward)):
                  median, iqr = time_us(operation, min_run_time=2.0)
                  row[name] = {"median_us": median, "iqr_us": iqr}
              print(json.dumps(row), flush=True)
              del module, image, reference, output
          PYCODE
          cat > validation-results/paired-probe.py <<'PYCODE'
          import json
          import os
          import statistics
          import subprocess
          import sys
          from pathlib import Path
          
          root = Path.cwd()
          child_code = (root / "validation-results/paired-child.py").read_text()
          checkouts = {"base": Path(os.environ["RUNNER_TEMP"]) / "kornia-mi-base", "fixed": root}
          children = {}
          metadata = {}
          for variant, checkout in checkouts.items():
              process = subprocess.Popen([sys.executable, "-u", "-c", child_code], cwd=checkout,
                                         stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
              children[variant] = process
              metadata[variant] = json.loads(process.stdout.readline())
              assert metadata[variant]["ready"]
          assert metadata["base"]["metadata"]["git_commit"].startswith("9a31191")
          assert metadata["fixed"]["metadata"]["git_commit"].startswith("a9808ab")
          assert metadata["base"]["source_sha256"] != metadata["fixed"]["source_sha256"]
          cases = [{"batch": b, "size": n, "mask": mask, "num_bins": 32}
                   for b, n in [(1, 128), (4, 256), (1, 512)]
                   for mask in ["none", "full", "overlap", "sparse"]]
          records = []
          for sample in range(5):
              order = ["base", "fixed"] if sample % 2 == 0 else ["fixed", "base"]
              for index in range(len(cases)):
                  case = cases[(index + 3 * sample) % len(cases)]
                  pair = {"sample": sample, "case": case, "order": order}
                  for variant in order:
                      process = children[variant]
                      process.stdin.write(json.dumps(case) + "\n")
                      process.stdin.flush()
                      row = json.loads(process.stdout.readline())
                      pair[variant] = row
                  for key in ["loss_sha256", "gradient_sha256"]:
                      assert pair["base"][key] == pair["fixed"][key], (case, key)
                  records.append(pair)
                  (root / "validation-results/paired-raw.json").write_text(json.dumps({"metadata": metadata, "pairs": records}, indent=2))
          for process in children.values():
              process.stdin.close()
              assert process.wait() == 0
          summary = []
          for case in cases:
              pairs = [pair for pair in records if pair["case"] == case]
              row = dict(case)
              for mode in ["from_ref_forward", "functional_forward_backward"]:
                  row[mode] = {
                      "base_us": statistics.median(pair["base"][mode]["median_us"] for pair in pairs),
                      "fixed_us": statistics.median(pair["fixed"][mode]["median_us"] for pair in pairs),
                      "paired_ratios": [pair["fixed"][mode]["median_us"] / pair["base"][mode]["median_us"] for pair in pairs],
                  }
              summary.append(row)
          (root / "validation-results/paired-summary.json").write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PYCODE
          .venv/bin/python validation-results/paired-probe.py
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mi-mask-paired-a9808ab
          path: validation-results/
          if-no-files-found: warn
          retention-days: 14
